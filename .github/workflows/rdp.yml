name: RDP Session (Bore Tunnel)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create user
        run: |
          net user runner "Pass1234567!" /add
          net localgroup Administrators runner /add
          net localgroup "Remote Desktop Users" runner /add

      - name: Download Bore
        run: |
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "$env:USERPROFILE\bore.zip"
          Expand-Archive -Path "$env:USERPROFILE\bore.zip" -DestinationPath "$env:USERPROFILE\bore"

      - name: Start Tunnel & Keep Alive
        run: |
          Write-Host "Starting tunnel... Check line below for remote port."
          & "$env:USERPROFILE\bore\bore.exe" local 3389 --to bore.pub

